name: Cost Janitor

on:
  pull_request:
    branches:
      - main

jobs:
  janitor:
    runs-on: ubuntu-latest

    services:
      localstack:
        image: localstack/localstack:3.8.1
        ports:
          - 4566:4566
        options: >-
          --health-cmd "curl -f http://localhost:4566/_localstack/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install -r janitor/requirements.txt

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.15.3"

      - name: Install tflocal
        run: pip install terraform-local

      - name: Terraform Init
        working-directory: terraform
        run: tflocal init

      - name: Terraform Validate
        working-directory: terraform
        run: terraform validate

      - name: Terraform Apply
        working-directory: terraform
        run: tflocal apply -auto-approve

      - name: Run Cost Janitor
        working-directory: janitor
        run: python3 janitor.py --dry-run --output-dir ../output

      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: cost-janitor-report
          path: |
            output/report.json
            output/report.md

      - name: Comment on PR if findings exist
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('output/report.json', 'utf8'));
            if (report.total_findings > 0) {
              const body = `## 🔍 Cost Janitor Report\n` +
                `**Findings:** ${report.total_findings}\n` +
                `**Estimated monthly waste:** $${report.estimated_monthly_waste_usd}\n\n` +
                `Check the workflow artifacts for the full report.`;
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
            }